version: "3.9"

# RetainIQ demo — production-ready POC.
# 2 services orchestrated:
#   - retainiq (Next.js frontend on host port 3007)
#   - retainiq-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  retainiq-backend:
    image: ghcr.io/wikolabs/retainiq-backend:latest
    container_name: retainiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  retainiq-net:
    name: retainiq-net
    driver: bridge
