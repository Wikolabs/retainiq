version: "3.9"

# retainiq demo - production-ready POC.
# 2 services orchestrated:
#   - retainiq (Next.js frontend on host port 3007)
#   - retainiq-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  retainiq-backend:
    image: ghcr.io/wikolabs/retainiq-backend:latest
    container_name: retainiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  retainiq:
    image: ghcr.io/wikolabs/retainiq:latest
    container_name: retainiq
    restart: unless-stopped
    ports:
      - "3007:3000"
    environment:
      BACKEND_URL: "http://retainiq-backend:8000"
    depends_on:
      - retainiq-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
