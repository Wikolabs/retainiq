version: "3.9"

# RetainIQ demo — production-ready POC.
# 2 services orchestrated:
#   - retainiq (Next.js frontend on host port 3007)
#   - retainiq-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  retainiq-backend:
    image: ghcr.io/wikolabs/retainiq-backend:latest
    container_name: retainiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - retainiq-net

  retainiq:
    image: ghcr.io/wikolabs/retainiq:latest
    container_name: retainiq
    restart: unless-stopped
    ports:
      - "3007:3000"
    environment:
      BACKEND_URL: "http://retainiq-backend:8000"
    depends_on:
      - retainiq-backend
    networks:
      - retainiq-net

networks:
  retainiq-net:
    name: retainiq-net
    driver: bridge
